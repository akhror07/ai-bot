services:
  - type: web
    name: ahrori-ai-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: RENDER_EXTERNAL_URL
        value: https://ahrori-ai-bot.onrender.com
      - key: MINI_APP_URL
        value: https://ahrori-ai-bot.onrender.com
